[project]
name = "relay-workbench"
version = "0.1.0"
description = "A local support-resolution workbench and staged AI engineering teaching project"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
references = [
    "openai>=2,<4",
    "temporalio>=1.10,<2",
    "mcp>=2,<3",
    "langchain-text-splitters>=1,<2",
    "langgraph>=1,<2",
    "langfuse>=3,<5",
    "qdrant-client>=1.15,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.hatch.build.targets.sdist]
# uv builds from this subdirectory; do not rely on the parent Git ignore file.
only-include = ["src/relay", "pyproject.toml"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.env", "**/.env.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
